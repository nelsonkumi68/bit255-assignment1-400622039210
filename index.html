<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueLib Catalogue</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="masthead">
    <div class="masthead__inner">
      <h1 class="masthead__logo">BlueLib</h1>
      <p class="masthead__sub">BlueCrest College Library Catalogue</p>
    </div>
  </header>

  <div class="page">

    <!-- Sidebar: controls + form -->
    <aside class="sidebar">

      <section class="sidebar__block">
        <h2 class="sidebar__title">Find a Book</h2>

        <label class="input-group">
          <span class="input-group__label">Title</span>
          <input type="search" id="q" placeholder="Type a title..." />
        </label>

        <label class="input-group">
          <span class="input-group__label">Category</span>
          <select id="cat">
            <option value="all">All categories</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </label>
      </section>

      <section class="sidebar__block">
        <h2 class="sidebar__title">Add a Book</h2>

        <form id="new-book-form" novalidate>
          <label class="input-group">
            <span class="input-group__label">Title</span>
            <input type="text" id="f-title" />
          </label>

          <label class="input-group">
            <span class="input-group__label">Author</span>
            <input type="text" id="f-author" />
          </label>

          <label class="input-group">
            <span class="input-group__label">Category</span>
            <select id="f-cat">
              <option value="">Choose...</option>
              <option value="IT">IT</option>
              <option value="Business">Business</option>
              <option value="Science">Science</option>
              <option value="Arts">Arts</option>
            </select>
          </label>

          <label class="input-group">
            <span class="input-group__label">Copies</span>
            <input type="number" id="f-copies" min="0" step="1" />
          </label>

          <button type="submit" class="btn btn--solid">Add to Catalogue</button>

          <p id="feedback" class="feedback" role="alert"></p>
        </form>
      </section>

    </aside>

    <!-- Main grid -->
    <main class="catalogue">
      <div class="catalogue__head">
        <h2 class="catalogue__title">Available Books</h2>
        <p id="counter" class="catalogue__counter"></p>
      </div>

      <div id="cards" class="cards"></div>
    </main>

  </div>

  <footer class="foot">
    <p>[NELSON ADUSAH KUMI] &middot; [400622039210]</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
